name: Setup and Greet
description: Print a greeting, date, and runner OS

inputs:
  name:
    description: Name of the person to greet
    required: true
  language:
    description: Language for the greeting
    required: false
    default: en

outputs:
  greeted:
    description: Whether the greeting was printed
    value: ${{ steps.greet.outputs.greeted }}

runs:
  using: composite
  steps:
    - name: Print greeting
      id: greet
      shell: bash
      run: |
        case "${{ inputs.language }}" in
          en)
            echo "Hello, ${{ inputs.name }}!"
            ;;
          es)
            echo "¡Hola, ${{ inputs.name }}!"
            ;;
          fr)
            echo "Bonjour, ${{ inputs.name }}!"
            ;;
          hi)
            echo "नमस्ते, ${{ inputs.name }}!"
            ;;
          *)
            echo "Hello, ${{ inputs.name }}!"
            ;;
        esac

        echo "greeted=true" >> "$GITHUB_OUTPUT"

    - name: Print date and runner OS
      shell: bash
      run: |
        echo "Current date: $(date)"
        echo "Runner OS: $RUNNER_OS"
