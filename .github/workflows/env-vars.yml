name: env-vars

on:
  workflow_dispatch:
env:
  APP_NAME: myapp
jobs:
  env-vars:
    env:
      ENVIRONMENT: staging
    runs-on: ubuntu-latest
    steps:
      - name: env-vars
        env:
          VERSION: 1.0.0
        run: |
          echo "APP_NAME: $APP_NAME"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "VERSION: $VERSION"
          echo "commit sha : ${{ github.sha }}"
          echo "actor: ${{ github.actor }}"
      
  
