name: matrix build

on:
  workflow_dispatch:

jobs:
  test:
     runs-on: ${{ matrix.OS }}
     strategy:
       matrix:
         python-version:
           - '3.10'
           - '3.11'
           - '3.12'
         OS:
           - ubuntu-latest
           - windows-latest
         exclude:
           - python-version: '3.10'
             os: windows-latest
        
          
     
     steps:
       - name: checkeout code
         uses: actions/checkout@v4
          
       - name: python setup
         uses: actions/setup-python@v5
         with:
           python-version: ${{ matrix.python-version }}
            
       - name: python verrsion
         run: python --version

      
    
  
