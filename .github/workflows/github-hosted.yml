         echo "$(hostname)" 
         echo "$(whoami)"

  job3:
    runs-on: macos-latest
    steps:
      - name: info
        run: |
         shell: bash
         'echo"the OS Name is : $RUNNER_OS"'
         echo "$(hostname)" 
         echo "$(whoami)"
