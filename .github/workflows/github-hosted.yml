name: github-hosted

on:
  workflow_dispatch:
    
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: info
        run: |
         shell: bash
         'echo"the OS Name is : $RUNNER_OS"'
         echo "$(hostname)" 
         echo "$(whoami)"

