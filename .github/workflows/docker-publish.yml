name: docker-publish

on:
  push:
    branches: 
      - main
    
jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: docker build
        run: docker build -t github-actions-practice:latest .
      
      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag github-actions-practice:latest ${{ secrets.DOCKER_USERNAME }}/github-actions-practice:latest
          docker tag github-actions-practice:latest ${{ secrets.DOCKER_USERNAME }}/github-actions-practice:sha-$SHORT_SHA


      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-practice:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-practice:sha-$SHORT_SHA

