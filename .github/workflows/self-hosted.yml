name: self-hosted runner

on:
  workflow_dispatch:

jobs:
  self-hosted-runner:
    runs-on: self-hosted

    steps:
      - name: hostname
        run: whoami

      - name: working directory
        run: pwd

      - name: file create 
        run: echo "hello fron self-hosted runner" > runner-test.txt

      - name: verify file
        run: ls -la runner-test.txt
