name: job-outputs

on:
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.date.outputs.today }}

    steps:
      - name: set todays date
        id: date
        run: echo "today=$(date) > $GITHUB_OUTPUT "

  job-2:
    runs-on: ubuntu-latest
    needs: job-1

    steps:
      - name: prints date
        run: echo "todays date is ${{ needs.job-1.outputs.today }}"
